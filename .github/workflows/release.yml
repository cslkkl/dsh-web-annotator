# 发布：推 `v*` 标签即构建、验收并建出 GitHub Release。
#
# ⚠️ **先验收、后发布，顺序不能反。** 这个 workflow 自己构建要发的 tgz，再拿它跑
# 真实宿主验收与 `verify:delivery`，全部通过才建 Release。反过来的话，挂上去的是
# 一个没跑过真实宿主的包 —— 而那从外面看与成功一模一样。
# 这也是本仓**不**在 CI 里跑同一套的原因：验收需要打包产物、完整 Harness 安装与
# Chromium，属于发版链路而不是每次 push 的日常门禁。
#
# ⚠️ **只写 Release**（`contents: write`），不改版本号、不推标签、不动分支。
# 版本号必须在打标签**之前**已经在 `package.json` 里 bump 过：标签名不参与任何
# 版本判定，对不上时 GitHub 会老老实实按 package.json 发**另一个**版本，
# 所以下面第一步就显式挡住。
#
# ⚠️ **三条顺序不能反**：先 `git apply` 补丁 → 再 `verify:browser-patch` → 再 `build:host`。
# `verify:browser-patch` 比对的是「补丁打到精确基线」与「宿主检出工作区」两份内容，
# 检出还没打补丁时它在第一个文件上必挂。同一处的理由见 [ci.yml](ci.yml)。
#
# ⚠️ **`--from-default-profile` 读的是 shipped 模板，不是个人 Profile**；验收脚本
# 自己把测试 home 建在工作区的 `work/` 下，这里不碰任何既有 Profile。
#
# ⚠️ **正文来自 `CHANGELOG.md` 的对应一节**（`npm run release:assets` 抽取），
# 缺这一节时脚本直接失败，不会退化成一份空正文。为什么不做成「按提交生成」：
# 本仓的改动多为直推，按提交生成的正文只会列到文档与 CI 改动。
name: Release

on:
  push:
    tags: ['v*']
  # 手动重跑：补一个漏掉的 Release、补附件，或在验收修好之后重试。
  #
  # ⚠️ **`tag` 必须显式给** —— `workflow_dispatch` 用的是**该 ref 上的 workflow 文件**，
  # 而 `github.ref_name` 是触发用的 ref。想要「用 main 上的新版 workflow 去补一个老标签」，
  # `--ref <tag>` 会跑那个标签上的旧 workflow，`--ref main` 又拿不到标签名。
  # 所以标签走输入参数，`github.ref_name` 只在推标签触发时才参与。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的既有标签（如 v0.2.0-alpha.10）'
        required: true
        type: string

permissions:
  # ⚠️ **必须是 write** —— 建 Release 要写仓库内容。只读时前面每一步都会成功，
  # 挂在最后的 `gh release create` 才 403，症状与「推标签不建 Release」一样。
  contents: write

concurrency:
  # 发布不能与另一次发布并发，也不能被后一次取消：取消发生在建 Release 之前
  # 会留下一个推了标签却没有 Release 的状态。
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    # 整轮上限。默认 6 小时：一旦某步挂住（不是失败，是不返回），不设限等于白占一台 runner。
    timeout-minutes: 45
    # 标签只在**一处**解析：推标签时是 `github.ref_name`，手动触发时是输入参数。
    # 下面的步骤一律读这个 env —— 手动触发时 `github.ref_name` 是 `main`，
    # 会让版本号校验和 Release 都指错。
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Verify the tag matches package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = $env:RELEASE_TAG -replace '^v', ''
          if ($version -ne $tag) {
            Write-Error "tag v$tag does not match package.json version $version"
            exit 1
          }
          Write-Output "releasing $version"

      - run: npm run check

      - run: npm run test:storage
        env:
          WEB_ANNOTATOR_BROWSER_CHANNEL: chrome

      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 639ed015397290b3745d163aafe02ffee4aa3f84
          path: .host-source

      - name: Apply the reviewed exact-version host patch
        working-directory: .host-source
        run: git -c core.autocrlf=false apply ../docs/harness-browser-annotation.patch

      - name: Verify the reviewed patch against its exact base
        run: npm run verify:browser-patch
        env:
          DSH_HOST_CHECKOUT: .host-source

      - run: npm run build:host
        env:
          DSH_HOST_CHECKOUT: .host-source

      - run: npm run typecheck:browser-provider
        env:
          DSH_HOST_CHECKOUT: .host-source

      # `prepack` 在这里断言产物齐全、版本与补丁哈希一致。
      - name: Pack the prebuilt bundle
        run: npm pack

      # ⚠️ **插件管理器是靠 `pnpm` 把 tgz 装进 profile 的**，不是 npm。
      # runner 上没有 pnpm，`dsh plugin ... add` 会以 `'pnpm' is not recognized` 失败，
      # 而那行错误只出现在 profile 内的 `pnpm.log` 里 —— 从 workflow 日志上只能看到
      # 「验收挂了」。版本钉成本机验收时的同一个，两边的解析行为才是同一套。
      - name: Install pnpm for the plugin manager
        shell: pwsh
        run: |
          npm install --global --no-audit --no-fund pnpm@12.8.1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # 插件管理器只认 PATH 上的 `pnpm`，而全局前缀不一定已经在 PATH 上。
          $prefix = (npm prefix --global).Trim()
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:PATH = "$env:PATH;$prefix"
          if (-not (Get-Command pnpm -ErrorAction SilentlyContinue)) {
            Write-Error "pnpm is not on PATH after installing it (prefix $prefix)"
            exit 1
          }
          pnpm --version

      # ⚠️ **必须显式给 `DSH_CLI_ENTRY`。** 验收脚本找 CLI 的顺序是
      # 「本仓依赖 → `%APPDATA%\npm` → `DSH_CLI_ENTRY`」，而在 runner 上前两个都不成立：
      # `actions/setup-node` 会把全局前缀指到工具缓存，不是 `%APPDATA%\npm`。
      # 少了这一行，验收会在读 `@deepseek-ai/dsh/package.json` 时 ENOENT ——
      # 全局装是成功的，所以从日志上看只像是「验收挂了」。
      - name: Install the exact Harness for the acceptance run
        shell: pwsh
        run: |
          npm install --global --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $cli = Join-Path (npm root -g).Trim() '@deepseek-ai/dsh/lib/bin.js'
          if (-not (Test-Path $cli)) {
            Write-Error "global Harness CLI not found at $cli"
            exit 1
          }
          "DSH_CLI_ENTRY=$cli" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "DSH_CLI_ENTRY=$cli"

      - name: Real host acceptance against the packed artifact
        shell: pwsh
        env:
          WEB_ANNOTATOR_BUNDLED_HOST: '1'
          WEB_ANNOTATOR_BROWSER_CHANNEL: chrome
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $env:WEB_ANNOTATOR_TARBALL = (Resolve-Path "./dsh-web-annotator-$version.tgz").Path
          npm run test:acceptance

      - name: Reconcile the delivered tarball with the accepted runtime
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $env:WEB_ANNOTATOR_TARBALL = (Resolve-Path "./dsh-web-annotator-$version.tgz").Path
          npm run verify:delivery

      # 失败时留下验收证据：少了它，runner 上的失败只剩一行超时，
      # 看不出界面到底渲染成了什么（第一轮就吃过这个亏）。
      - name: Upload the acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-artifacts
          path: integration/annotation-artifacts
          if-no-files-found: ignore

      - name: Assemble the release assets
        run: npm run release:assets

      - name: Create or update the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag -replace '^v', ''
          $dir = 'integration/release-assets'
          # 正文与附件分开：附件目录里的**每一个文件**都会被挂上去，
          # 所以正文写在目录外，免得 Release 上多出一个 `release-notes.md`。
          $notes = 'integration/release-notes.md'
          # 幂等：重跑时 Release 可能已存在，那就更新正文与附件，而不是报错退出 ——
          # 否则「补正文」「补附件」这两个最常见的诉求反而修不了。
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "release $tag already exists - updating notes"
            gh release edit $tag --notes-file $notes
          } else {
            # `--verify-tag`：不让 gh 去猜或新建标签，标签必须已存在。
            # `--prerelease`：alpha 是预览版，不能冒充稳定版。
            gh release create $tag --title "DSH 网页批注 $version" `
              --notes-file $notes --verify-tag --prerelease
          }
          foreach ($asset in (Get-ChildItem $dir -File)) {
            gh release upload $tag $asset.FullName --clobber
          }
