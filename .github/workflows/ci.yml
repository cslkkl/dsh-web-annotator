name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:storage
        env:
          WEB_ANNOTATOR_BROWSER_CHANNEL: chrome
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 639ed015397290b3745d163aafe02ffee4aa3f84
          path: .host-source
      - name: Apply the reviewed exact-version host patch
        working-directory: .host-source
        run: git -c core.autocrlf=false apply ../docs/harness-browser-annotation.patch
      - run: npm run build:host
        env:
          DSH_HOST_CHECKOUT: .host-source
      - run: npm pack --dry-run --json
