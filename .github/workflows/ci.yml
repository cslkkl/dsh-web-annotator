name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # format → lint → layering → doc paths → build → typecheck → test.
      - run: npm run check
      - run: npm run test:storage
        env:
          WEB_ANNOTATOR_BROWSER_CHANNEL: chrome
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 639ed015397290b3745d163aafe02ffee4aa3f84
          path: .host-source
      # ⚠️ 顺序不能反：`verify:browser-patch` 比对的是「补丁打到精确基线」与
      # 「宿主检出工作区」两份内容，所以检出**必须先打补丁**，否则它拿干净的基线
      # 去比打了补丁的结果，在第一个文件上就必挂（换来一条看不出因果的红）。
      - name: Apply the reviewed exact-version host patch
        working-directory: .host-source
        run: git -c core.autocrlf=false apply ../docs/harness-browser-annotation.patch
      - name: Verify the reviewed patch against its exact base
        run: npm run verify:browser-patch
        env:
          DSH_HOST_CHECKOUT: .host-source
      - run: npm run build:host
        env:
          DSH_HOST_CHECKOUT: .host-source
      - run: npm run typecheck:browser-provider
        env:
          DSH_HOST_CHECKOUT: .host-source
      - run: npm pack --dry-run --json
